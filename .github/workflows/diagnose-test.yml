name: Diagnose test

# Read-only report on the test database: recent sync runs and their errors, which credentials
# are entered (never their values) and how much Autotask data Pulse holds. Run by hand.

on:
  workflow_dispatch:
    inputs:
      inspect_opportunity:
        description: "Optional: an Autotask opportunity id to inspect (read-only)"
        required: false
        default: ""
      refresh_job:
        description: "Optional: run a sync job now (scorecard, projects, departments, directory, connections) or inspect:simplesat"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

env:
  RG: rg-hdit-pulse-test-aue
  SQL_SERVER_NAME: sql-hdit-pulse-test-aue
  SQL_SERVER: sql-hdit-pulse-test-aue.database.windows.net
  SQL_DATABASE: sqldb-hdit-pulse-test-aue

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci --no-audit --no-fund --omit=dev
        working-directory: backend
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID || '6dcedf3f-9147-4fd7-b8bf-472ab77b7cf1' }}
          tenant-id: ${{ vars.AZURE_TENANT_ID || '0b1e12e5-f6cd-4ae7-a9ff-4562637a0c44' }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID || '1d9bced5-726c-4ef9-a4d3-63c350b6647c' }}
      - name: Key Vault access (role assignments on the vault and its secrets)
        run: |
          api=$(az identity show -g "$RG" -n id-hdit-pulse-api-test-aue --query principalId -o tsv)
          sync=$(az identity show -g "$RG" -n id-hdit-pulse-sync-test-aue --query principalId -o tsv)
          echo "API identity principal: $api"; echo "Sync identity principal: $sync"
          kvid=$(az keyvault show -n kv-hdit-pulse-test -g "$RG" --query id -o tsv)
          for who in api sync; do
            pid=${!who}
            echo "--- $who ---"
            az role assignment list --assignee "$pid" --all --include-inherited \
              --query "[?contains(scope, 'kv-hdit-pulse-test')].{role:roleDefinitionName, scope:scope}" -o tsv | sed "s|$kvid|<vault>|" || true
          done
          echo "--- secrets in the vault (names only) ---"
          az keyvault secret list --vault-name kv-hdit-pulse-test --query "[].name" -o tsv 2>&1 | head -20 || true
      - name: Open firewall for this run
        run: |
          ip=$(curl -s --max-time 10 https://api.ipify.org); echo "RUNNER_IP=$ip" >> "$GITHUB_ENV"
          az sql server firewall-rule create -g "$RG" -s "$SQL_SERVER_NAME" -n "diag-${{ github.run_id }}" --start-ip-address "$ip" --end-ip-address "$ip" -o none
      - name: Report
        working-directory: backend
        env:
          INSPECT_OPPORTUNITY: ${{ github.event.inputs.inspect_opportunity }}
          REFRESH_JOB: ${{ github.event.inputs.refresh_job }}
        run: |
          for i in 1 2 3; do node scripts/diagnose.js && exit 0; sleep 20; done; exit 1
      - name: Close firewall
        if: always() && env.RUNNER_IP != ''
        run: az sql server firewall-rule delete -g "$RG" -s "$SQL_SERVER_NAME" -n "diag-${{ github.run_id }}" -o none || true
