<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HD IT Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --ink:#0d1424; --bar:#0d1424; --bar-text:#e8edf5; --bar-muted:#9aa7bd; --bar-line:#2c3850; --bar-hover:#1b2436;
  --accent:#0f9d8f; --accent-deep:#0b7d72; --accent-wash:#e8f3f2;
  --bg:#f5f7fa; --surface:#ffffff; --surface-2:#f0f3f7; --hover:#f7fafb;
  --text:#18202e; --muted:#55606b; --muted-2:#6f7c93; --line:#e3e7ee; --line-2:#d3d9e3;
  --good:#1d8a4c; --good-wash:#e5f3ea; --warn:#a86a0b; --warn-wash:#fcf1dc; --bad:#c23a3a; --bad-wash:#fae8e8;
  --skel:#e7ebf1;
  --shadow:0 1px 2px rgba(13,20,36,.06),0 1px 1px rgba(13,20,36,.03);
  --font-ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-display:'Inter Tight','Inter',system-ui,sans-serif;
  --r:10px; --top:58px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bar:#070b13; --accent:#27b8a8; --accent-deep:#5fd3c5; --accent-wash:#0f2e2c;
    --bg:#0b111b; --surface:#121a27; --surface-2:#182232; --hover:#172131;
    --text:#e5eaf2; --muted:#a3aec0; --muted-2:#8591a6; --line:#223047; --line-2:#2c3b55;
    --good:#44c67e; --good-wash:#12301f; --warn:#e0a643; --warn-wash:#33260f; --bad:#ef6b6b; --bad-wash:#3a1717;
    --skel:#1d2838; --shadow:0 1px 2px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bar:#070b13; --accent:#27b8a8; --accent-deep:#5fd3c5; --accent-wash:#0f2e2c;
  --bg:#0b111b; --surface:#121a27; --surface-2:#182232; --hover:#172131;
  --text:#e5eaf2; --muted:#a3aec0; --muted-2:#8591a6; --line:#223047; --line-2:#2c3b55;
  --good:#44c67e; --good-wash:#12301f; --warn:#e0a643; --warn-wash:#33260f; --bad:#ef6b6b; --bad-wash:#3a1717;
  --skel:#1d2838; --shadow:0 1px 2px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 var(--font-ui);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
a{color:var(--accent-deep)}
h1,h2,h3{margin:0;text-wrap:balance}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg.i{width:16px;height:16px;flex:0 0 16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:30;height:var(--top);background:var(--bar);color:var(--bar-text);display:flex;align-items:center;gap:12px;padding:0 16px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;min-width:0}
.brand-logo{height:34px;display:block;background:#fff;padding:5px 9px;border-radius:7px}
.brand-name{font:700 16px/1.1 var(--font-display);letter-spacing:.01em}
.brand-sub{font-size:11.5px;color:var(--bar-muted)}
.spacer{flex:1}
.env{font-size:10.5px;font-weight:700;letter-spacing:.06em;border-radius:999px;padding:2px 8px;background:#3a2c0b;color:#f3c66b;white-space:nowrap}
.env.prod{background:#103a2e;color:#62d7a6}
.ver{font-size:11px;color:var(--bar-muted);border:1px solid var(--bar-line);border-radius:999px;padding:1px 7px;white-space:nowrap}
.tb-btn{background:transparent;border:1px solid var(--bar-line);color:var(--bar-text);border-radius:8px;padding:6px 10px;cursor:pointer;font-size:12.5px;display:inline-flex;align-items:center;gap:6px}
.tb-btn:hover{background:var(--bar-hover)}
.avatar{width:34px;height:34px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-weight:700;font-size:12.5px;cursor:pointer}
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 8px);min-width:250px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgba(0,0,0,.18);padding:6px;z-index:40}
.menu .who{padding:10px 12px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.menu .who b{display:block}
.menu .who span{font-size:12px;color:var(--muted);word-break:break-all}
.menu a,.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;text-decoration:none;color:var(--text);font-size:13px}
.menu a:hover,.menu button:hover{background:var(--hover)}
.menu .lab{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2);padding:8px 12px 2px}
.menu select{margin:4px 12px 8px;width:calc(100% - 24px);border:1px solid var(--line-2);border-radius:8px;padding:6px 8px;background:var(--surface)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:calc(100% - var(--top))}
.side{border-right:1px solid var(--line);background:var(--surface);padding:16px 10px;display:flex;flex-direction:column;gap:2px;position:sticky;top:var(--top);height:calc(100vh - var(--top));overflow:auto}
.side-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted-2);padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--text);font-weight:500;white-space:nowrap}
.nav a:hover{background:var(--hover)}
.nav a.on{background:var(--accent-wash);color:var(--accent-deep)}
.nav a.soon{color:var(--muted-2)}
.nav a .tag{margin-left:auto}
.nav .txt{overflow:hidden;text-overflow:ellipsis}
.side-foot{margin-top:auto;padding:14px 10px 0;font-size:12px;color:var(--muted)}
.side-foot b{display:block;color:var(--text);font-weight:600}
.collapse{margin-top:8px;align-self:flex-start;background:none;border:1px solid var(--line);border-radius:8px;padding:5px 8px;cursor:pointer;color:var(--muted);font-size:12px;display:inline-flex;gap:6px;align-items:center}
.shell.compact{grid-template-columns:64px minmax(0,1fr)}
.shell.compact .side{padding:16px 8px}
.shell.compact .side-label,.shell.compact .nav .txt,.shell.compact .nav .tag,.shell.compact .side-foot{display:none}
.shell.compact .nav a{justify-content:center;padding:9px 0}
.shell.compact .collapse{align-self:center}
main{padding:24px 28px 48px;min-width:0}
main.full{padding:0}
.wrap{max-width:1320px;margin:0 auto;display:flex;flex-direction:column;gap:26px}

/* ---------- page parts ---------- */
.ph h1{font:700 26px/1.15 var(--font-display);letter-spacing:-.01em}
.ph p{margin:6px 0 0;color:var(--muted);max-width:72ch}
.crumb{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.crumb a{text-decoration:none}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-h{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.sec-h h2{font:700 15px/1.2 var(--font-display)}
.sec-h .srcs{font-size:12px;color:var(--muted-2)}
.sec-h a{margin-left:auto;font-size:13px;font-weight:600;text-decoration:none}
.tag{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted-2);border:1px solid var(--line);white-space:nowrap}
.tag.live{background:var(--good-wash);color:var(--good);border-color:transparent}
.tag.role{background:var(--accent-wash);color:var(--accent-deep);border-color:transparent;text-transform:none;letter-spacing:0;font-size:11.5px}
.note{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.note.warn{background:var(--warn-wash);border-color:transparent;color:var(--text)}
.note b{color:var(--text)}

/* app cards */
.apps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.app{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s;min-width:0}
a.app:hover{border-color:var(--accent);transform:translateY(-1px)}
.app .ic{width:38px;height:38px;border-radius:10px;background:var(--accent-wash);color:var(--accent-deep);display:grid;place-items:center}
.app .ic svg{width:20px;height:20px}
.app h3{font:700 16px/1.2 var(--font-display)}
.app p{margin:0;color:var(--muted);font-size:13px;flex:1}
.app .foot{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted-2)}
.app .go{margin-left:auto;font-weight:600;color:var(--accent-deep)}
.app.off{opacity:.62;box-shadow:none;border-style:dashed}
.app.off .ic{background:var(--surface-2);color:var(--muted-2)}

/* coming-soon widgets */
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.w{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r);padding:14px 16px 12px;display:flex;flex-direction:column;gap:12px;min-width:0;color:var(--muted-2)}
.w-h{display:flex;align-items:center;gap:8px}
.w-h h3{font-size:13px;font-weight:600;color:var(--muted)}
.w-h .src{margin-left:auto;font-size:10px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.w-f{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;border-top:1px solid var(--line);padding-top:9px}
.skel{display:flex;flex-direction:column;gap:7px;min-height:58px;justify-content:flex-end}
.skel i{display:block;height:9px;border-radius:5px;background:var(--skel)}
.skel.big i:first-child{height:24px;width:46%}
.skel.bars{flex-direction:row;align-items:flex-end;gap:6px}
.skel.bars i{flex:1;width:auto;border-radius:4px 4px 0 0}
.skel.spark svg{width:100%;height:46px}
.skel.spark path{fill:none;stroke:var(--skel);stroke-width:3;stroke-linecap:round}

/* app frame */
.frame-wrap{position:relative;height:calc(100vh - var(--top));display:flex;flex-direction:column}
.frame-bar{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--surface);font-size:12.5px;color:var(--muted)}
.frame-bar b{color:var(--text);font-weight:600}
.frame-bar a{margin-left:auto;text-decoration:none;font-weight:600}
iframe.app-frame{flex:1;width:100%;border:0;background:var(--bg);display:block}
.frame-loading{position:absolute;inset:44px 0 0;display:grid;place-items:center;color:var(--muted);pointer-events:none}

/* tables */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{font:700 15px/1.25 var(--font-display)}
.panel > p{margin:0;color:var(--muted);font-size:13px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td code{font-size:12px;background:var(--surface-2);padding:1px 6px;border-radius:5px}
.yes{color:var(--good);font-weight:700}
.dim{color:var(--muted-2)}

/* sign-in */
.signin{min-height:100%;display:grid;place-items:center;padding:40px 16px}
.signin-card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 30px rgba(13,20,36,.08);padding:28px;display:flex;flex-direction:column;gap:16px}
.signin-card .brand-logo{height:40px;border:1px solid var(--line);align-self:flex-start}
.signin-card h1{font:700 24px/1.2 var(--font-display)}
.signin-card p{margin:0;color:var(--muted)}
.ms-btn{display:flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line-2);border-radius:9px;padding:11px;background:var(--surface);font-weight:600;cursor:pointer;font-size:14px}
.ms-btn:hover{background:var(--hover);border-color:var(--accent)}
.err{color:var(--bad);font-size:13px;font-weight:600}
.small{font-size:12px;color:var(--muted-2)}

.denied{background:var(--surface);border:1px dashed var(--line-2);border-radius:var(--r);padding:32px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:8px;align-items:center}
.denied h2{font:700 18px var(--font-display);color:var(--text)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;z-index:70;max-width:calc(100% - 32px)}

@media (max-width:1180px){ .grid{grid-template-columns:repeat(2,minmax(0,1fr))} .apps{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:860px){
  .shell,.shell.compact{grid-template-columns:1fr}
  .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);flex-direction:row;overflow-x:auto;padding:8px 12px;gap:4px}
  .side-label,.side-foot,.collapse,.nav .tag{display:none}
  .shell.compact .nav .txt{display:inline}
  main{padding:20px 16px 40px}
  .brand-sub,.ver{display:none}
  .frame-wrap{height:calc(100vh - var(--top) - 54px)}
}
@media (max-width:620px){ .grid,.apps{grid-template-columns:1fr} .env{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const PREVIEW_PERSONAS = [
  { k: "admin", label: "Platform administrator", name: "George Hanna", email: "george.hanna@hdit.com.au", roles: ["Pulse.Admin"] },
  { k: "sales", label: "Sales: Pipeline, Whitespace editor, Marketing ROI", name: "Taylor Reid", email: "taylor.reid@hdit.com.au", roles: ["Pipeline.User", "Whitespace.Editor", "MarketingROI.User"] },

  { k: "staff", label: "New starter: no apps yet", name: "Morgan Ellis", email: "morgan.ellis@hdit.com.au", roles: ["Pulse.User"] },
];
const Auth = (() => {
  let pca = null, account = null, user = null, roles = [];
  const decode = t => { try { return JSON.parse(decodeURIComponent(escape(atob(t.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))))); } catch (e) { return {}; } };
  function fromToken(t) {
    const c = decode(t);
    roles = Array.isArray(c.roles) ? c.roles : [];
    user = { name: c.name || (account && account.name) || "", email: c.preferred_username || (account && account.username) || "", oid: c.oid || "" };
  }
  function preview() {
    let k = "admin"; try { k = localStorage.getItem("hdit-pulse:preview") || "admin"; } catch (e) {}
    const p = PREVIEW_PERSONAS.find(x => x.k === k) || PREVIEW_PERSONAS[0];
    user = { name: p.name, email: p.email, oid: "preview" }; roles = p.roles.slice();
  }
  /** Returns true when someone is signed in. Throws a friendly error for sign-in failures. */
  async function init() {
    if (CONFIG.PREVIEW) { preview(); return true; }
    if (!window.msal) throw new Error("The sign-in library didn't load. Reload the page.");
    pca = await msal.PublicClientApplication.createPublicClientApplication({
      auth: { clientId: DEPLOY.clientId, authority: `https://login.microsoftonline.com/${DEPLOY.tenantId}`,
        redirectUri: location.origin + "/", postLogoutRedirectUri: location.origin + "/", navigateToLoginRequestUrl: true },
      cache: { cacheLocation: "localStorage" },
    });
    let r = null;
    try { r = await pca.handleRedirectPromise(); }
    catch (e) { throw friendly(e); }
    account = (r && r.account) || pca.getActiveAccount() || pca.getAllAccounts()[0] || null;
    if (!account) return false;
    pca.setActiveAccount(account);
    if (r && r.accessToken && (r.scopes || []).some(s => s.endsWith("access_as_user"))) fromToken(r.accessToken);
    else await token();
    return true;
  }
  function friendly(e) {
    const m = String((e && (e.errorMessage || e.message)) || e);
    if (/AADSTS50105/.test(m)) return new Error("Your Microsoft 365 account isn't set up for Pulse yet. Ask a Pulse administrator to add you to a Pulse group, then sign in again.");
    if (/AADSTS65001|consent/i.test(m)) return new Error("An administrator needs to approve Pulse for your organisation first.");
    if (/user_cancelled|AADSTS50058/.test(m)) return new Error("Sign-in was cancelled.");
    return new Error("Sign-in didn't complete: " + m.split("\n")[0].slice(0, 220));
  }
  /** An access token for Pulse's API scope. Signs in again (redirect) when Microsoft asks for it. */
  async function token(force = false) {
    if (CONFIG.PREVIEW) throw new Error("Preview: apps sign in once Pulse is deployed.");
    try {
      const r = await pca.acquireTokenSilent({ scopes: [CONFIG.API_SCOPE], account, forceRefresh: !!force });
      fromToken(r.accessToken); return r.accessToken;
    } catch (e) {
      if (e instanceof msal.InteractionRequiredAuthError || /interaction_required|login_required|consent_required|no_tokens_found/i.test(e.errorCode || "")) {
        await pca.acquireTokenRedirect({ scopes: [CONFIG.API_SCOPE], account });
        return new Promise(() => {});          // the page is navigating away
      }
      throw friendly(e);
    }
  }
  const signIn = () => pca.loginRedirect({ scopes: [CONFIG.API_SCOPE], prompt: "select_account" });
  const signOut = () => CONFIG.PREVIEW ? location.reload() : pca.logoutRedirect({ account });
  return { init, token, signIn, signOut, user: () => user, roles: () => roles, setPreview(k) { try { localStorage.setItem("hdit-pulse:preview", k); } catch (e) {} preview(); } };
})();

/* =====================================================================
   TOKEN HAND-OFF to embedded apps (postMessage, exact origins only)
   ===================================================================== */
window.addEventListener("message", async e => {
  const m = e.data;
  if (!m || m.type !== "pulse:token-request") return;
  const frame = [...document.querySelectorAll("iframe[data-app]")].find(f => f.contentWindow === e.source);
  if (!frame) return;
  const a = APPS.find(x => x.k === frame.dataset.app);
  if (!a || !a.url || e.origin !== new URL(a.url).origin) return;      // only the app we framed, at its exact address
  let reply;
  try {
    if (!canOpen(a)) throw new Error(`You don't have access to ${a.name}.`);
    reply = { type: "pulse:token", id: m.id, token: await Auth.token(!!m.force) };
  } catch (err) { reply = { type: "pulse:token", id: m.id, error: err.message }; }
  e.source.postMessage(reply, e.origin);
});

  const rows = mine.length ? mine.map(v => { const r = roleInfo(v); return `<tr><td><b>${esc(r.label)}</b><div class="dim"><code>${esc(r.v)}</code></div></td><td>${esc(r.grants)}</td><td>${esc(r.group)}</td></tr>`; }).join("")
    : `<tr><td colspan="3" class="dim">No roles yet.</td></tr>`;
  let h = `<div class="ph"><div class="crumb"><a href="#/">Home</a> / Platform</div><h1>Your access</h1>
      <p>What you can open in Pulse, and why. Access is managed in Microsoft Entra ID through groups; changes apply the next time you sign in.</p></div>
    <section class="panel"><h2>Signed in as</h2><p><b>${esc(u.name)}</b> · ${esc(u.email)}</p></section>
    <section class="panel"><h2>Your roles</h2><div class="tbl-wrap"><table><thead><tr><th>Role</th><th>What it gives you</th><th>Usually from group</th></tr></thead><tbody>${rows}</tbody></table></div></section>
    <section class="panel"><h2>Apps</h2><div class="tbl-wrap"><table><thead><tr><th>App</th><th>Your access</th><th>Status</th></tr></thead><tbody>
      ${APPS.map(a => `<tr><td><b>${esc(a.name)}</b></td><td>${canOpen(a) ? `<span class="yes">✓</span> ${appRole(a)}` : `<span class="dim">No access</span>`}</td><td>${a.url ? `<span class="tag live">Live</span>` : `<span class="tag">Moving into Pulse</span>`}</td></tr>`).join("")}
    </tbody></table></div></section>`;
  if (isPlatformAdmin()) h += `<section class="panel"><h2>How access is set up</h2>
      <p>Each role below is an app role on the <b>HD IT Pulse</b> enterprise application, assigned to the matching security group. To give someone access, add them to the group in the Entra admin centre (Groups → the group → Members). To change what a group gets, use Enterprise applications → HD IT Pulse → Users and groups.</p>
      <div class="tbl-wrap"><table><thead><tr><th>Group</th><th>Role</th><th>Grants</th></tr></thead><tbody>
      ${ROLES.map(r => `<tr><td>${esc(r.group)}</td><td><code>${esc(r.v)}</code></td><td>${esc(r.grants)}</td></tr>`).join("")}
      </tbody></table></div><p><a href="https://entra.microsoft.com/" target="_blank" rel="noopener">Open the Entra admin centre ${icon("ext")}</a></p></section>`;
  return h;
}

/* ---------- routing ---------- */
function parseRoute() {
  const parts = (location.hash || "#/").replace(/^#\/?/, "").split("/").filter(Boolean);
  if (parts[0] === "app" && parts[1]) return { page: "app", id: parts[1] };
  if (parts[0] === "area" && parts[1]) return { page: "area", id: parts[1] };
  if (parts[0] === "access") return { page: "access" };
  return { page: "home" };
}
function render() {
  const r = parseRoute();
  let body, full = false;
  if (r.page === "app") ({ html: body, full } = viewApp(r.id));
  else if (r.page === "area") body = viewArea(r.id);
  else if (r.page === "access") body = viewAccess();
  else body = viewHome();
  const compact = State.compact == null ? r.page === "app" : State.compact;
  $("#app").innerHTML = topbar() + `<div class="shell ${compact ? "compact" : ""}">${sidebar(r)}
    <main class="${full ? "full" : ""}">${full ? body : `<div class="wrap">${body}</div>`}</main></div>`;
  wire();
  const f = document.querySelector("iframe.app-frame");
  if (f) f.addEventListener("load", () => { const l = $("#frame-loading"); if (l) l.remove(); });
  const a = APPS.find(x => x.k === r.id);
  document.title = r.page === "app" && a ? `${a.name} · HD IT Pulse` : "HD IT Pulse";
}
function closeMenus() { ["#help-menu", "#user-menu"].forEach(m => { const el = $(m); if (el) el.hidden = true; }); }
function wire() {
  const tog = (b, m) => { $(b).onclick = e => { e.stopPropagation(); const open = $(m).hidden; closeMenus(); $(m).hidden = !open; $(b).setAttribute("aria-expanded", String(open)); }; };
  tog("#btn-help", "#help-menu"); tog("#btn-user", "#user-menu");
  $("#btn-signout").onclick = () => Auth.signOut();
  $("#btn-collapse").onclick = () => {
    const now = !document.querySelector(".shell").classList.contains("compact");
    State.compact = now; try { localStorage.setItem("hdit-pulse:compact", JSON.stringify(now)); } catch (e) {}
    document.querySelector(".shell").classList.toggle("compact", now);
  };
  const pv = $("#preview-as");
  if (pv) pv.onchange = () => { Auth.setPreview(pv.value); render(); toast("Previewing as " + PREVIEW_PERSONAS.find(p => p.k === pv.value).label); };
}
document.addEventListener("click", e => { if (!e.target.closest(".menu-wrap")) closeMenus(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenus(); });
window.addEventListener("hashchange", () => { closeMenus(); render(); window.scrollTo(0, 0); });

(async function boot() {
  $("#app").innerHTML = `<div class="signin"><div class="small">Signing you in…</div></div>`;
  try {
    if (await Auth.init()) render();
    else renderSignIn();
  } catch (e) { renderSignIn(e.message); }
})();
</script>
</body>
</html>
